<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JNL Glory</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link href="{{ url_for('static', filename='tokens.css') }}" rel="stylesheet">
<link href="{{ url_for('static', filename='base.css') }}" rel="stylesheet">
<style>
body {
  display: flex;
  align-items: center;
  justify-content: center;
}

.login {
  width: 92%;
  max-width: 320px;
}

.brand {
  font-size: 14px;
  font-weight: 600;
  color: var(--secondary);
  margin-bottom: 40px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-mark {
  width: 10px;
  height: 10px;
  background: var(--signal);
  border-radius: 2px;
  transform: rotate(45deg);
  flex-shrink: 0;
}

.heading {
  font-size: 20px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}

.sub {
  font-size: 14px;
  color: var(--secondary);
  margin-bottom: 32px;
}

.field-label {
  display: block;
  font-size: 13px;
  color: var(--secondary);
  margin-bottom: 6px;
}

.key-input {
  width: 100%;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: var(--mono);
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
  margin-bottom: 20px;
}

.key-input:focus {
  border-color: var(--dim);
}

.key-input::placeholder {
  color: var(--dim);
}

.submit {
  width: 100%;
  padding: 10px;
  background: var(--action);
  border: none;
  border-radius: var(--radius);
  color: var(--action-text);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: opacity 0.15s;
}

.submit:hover { opacity: 0.88; }

.err {
  margin-top: 16px;
  font-size: 13px;
  color: var(--danger);
}
</style>
</head>
<body>
  <div class="login">
    <div class="brand">
      <div class="brand-mark"></div>
      JNL Glory
    </div>
    <h1 class="heading">Welcome back</h1>
    <p class="sub">Enter your product key to continue</p>
    <form method="POST">
      <label class="field-label" for="admin_key">Product key</label>
      <input class="key-input" type="password" id="admin_key" name="admin_key" placeholder="Enter your key" required autofocus autocomplete="off">
      <button class="submit" type="submit">Continue</button>
      {% if error %}<p class="err">{{ error }}</p>{% endif %}
    </form>
  </div>
</body>
</html>
