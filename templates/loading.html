<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading</title>
<style>
html, body { overflow-x: clip; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #101318;
}
.ring {
  width: 32px;
  height: 32px;
  border: 2px solid rgba(130, 140, 160, 0.12);
  border-top-color: #878d9b;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .ring { animation: none; border-top-color: transparent; }
}
</style>
</head>
<body>
  <div class="ring"></div>
  <noscript><meta http-equiv="refresh" content="0;url={{ next_url }}"></noscript>
  <script>setTimeout(function(){ window.location.href = "{{ next_url }}"; }, 800);</script>
</body>
</html>
